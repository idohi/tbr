[tox]
envlist = py38,py39,py310,py311,py312,lint,type-check,docs,docstring
isolated_build = true

[testenv]
deps =
    pytest>=7.0.0
    pytest-cov>=4.0.0
    pytest-xdist>=3.0.0
commands =
    pytest {posargs}

[testenv:lint]
deps =
    ruff>=0.1.0
    black>=23.0.0
    isort>=5.12.0
commands =
    ruff check src tests
    black --check src tests
    isort --check-only src tests

[testenv:type-check]
deps =
    mypy>=1.0.0
    pandas-stubs
    types-setuptools
commands =
    mypy src/tbr

[testenv:docs]
deps =
    sphinx>=6.0.0
    sphinx-rtd-theme>=1.2.0
commands =
    sphinx-build -W -b html docs docs/_build/html

[testenv:docstring]
deps =
    pydocstyle[toml]>=6.3.0
    interrogate>=1.5.0
commands =
    pydocstyle src --convention=numpy
    interrogate src --fail-under=90 -v

[testenv:build]
deps =
    build>=0.10.0
    twine>=4.0.0
commands =
    python -m build
    twine check dist/*

[testenv:coverage]
deps =
    pytest>=7.0.0
    pytest-cov>=4.0.0
commands =
    pytest --cov=src/tbr --cov-report=html --cov-report=term-missing

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --disable-warnings
