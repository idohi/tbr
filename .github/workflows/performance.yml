name: Performance Monitoring

on:
  schedule:
    # Run performance tests daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual triggering
  push:
    branches: [ main ]
    paths:
      - 'src/tbr/**'
      - 'tests/performance/**'

jobs:
  performance-monitoring:
    runs-on: ubuntu-latest
    name: Performance Regression Detection

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch full history for comparison

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-perf-monitor-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-perf-monitor-
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    - name: Run performance benchmarks
      run: |
        pytest tests/performance/ -v --durations=0 --tb=short > performance_results.txt
        echo "=== Performance Summary ===" >> performance_results.txt
        echo "Timestamp: $(date)" >> performance_results.txt
        echo "Commit: ${{ github.sha }}" >> performance_results.txt
        echo "Branch: ${{ github.ref }}" >> performance_results.txt

    - name: Upload performance results
      uses: actions/upload-artifact@v4
      with:
        name: performance-results-${{ github.sha }}
        path: performance_results.txt
        retention-days: 90

    - name: Performance regression check
      run: |
        echo "Performance monitoring completed"
        echo "Results saved to artifacts for analysis"
        # Future: Add performance regression detection logic here

  cross-platform-performance:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    name: Performance Test - ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-cross-perf-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-cross-perf-
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    - name: Run performance tests
      run: |
        pytest tests/performance/ -v --tb=short

    - name: Run scalability tests
      run: |
        pytest tests/performance/ -m slow -v --tb=short
